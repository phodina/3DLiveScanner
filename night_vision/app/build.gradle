apply plugin: 'com.android.application'

android {
    namespace 'com.lvonasek.tofviewer'
    compileSdkVersion 33
    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 33
    }
    signingConfigs {
        release {
            // Use environment variables for CI, or gradle properties for local builds
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main.java.srcDirs += '../../common/record/'
        main.java.srcDirs += '../../common/utils/'
    }
}

dependencies {
    implementation 'com.google.ar:core:1.23.0'
    implementation 'org.jcodec:jcodec:0.2.3'
    implementation 'org.jcodec:jcodec-android:0.2.3'
    implementation files('src/main/libs/sdk-base-1.190.0.aar')
}
