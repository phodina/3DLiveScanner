name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle
    - name: Build scanner
      run: cd scanner && ./gradlew build
    - name: Build night_vision
      run: cd night_vision && ./gradlew build
    - name: Upload scanner APK
      uses: actions/upload-artifact@v4
      with:
        name: scanner-apk
        path: scanner/app/build/outputs/apk/**/*.apk
    - name: Upload night_vision APK
      uses: actions/upload-artifact@v4
      with:
        name: night_vision-apk
        path: night_vision/app/build/outputs/apk/**/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download scanner APK
      uses: actions/download-artifact@v4
      with:
        name: scanner-apk
        path: scanner-apk
    - name: Download night_vision APK
      uses: actions/download-artifact@v4
      with:
        name: night_vision-apk
        path: night_vision-apk
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          scanner-apk/**/*.apk
          night_vision-apk/**/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
