name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle
    - name: Decode Keystore
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/keystore.jks
        else
          echo "KEYSTORE_BASE64 secret not set, skipping keystore decode"
        fi
    - name: Build scanner
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: cd scanner && ./gradlew assembleRelease
    - name: Build night_vision
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: cd night_vision && ./gradlew assembleRelease
    - name: Upload scanner APK
      uses: actions/upload-artifact@v4
      with:
        name: scanner-apk
        path: scanner/app/build/outputs/apk/**/*.apk
    - name: Upload night_vision APK
      uses: actions/upload-artifact@v4
      with:
        name: night_vision-apk
        path: night_vision/app/build/outputs/apk/**/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download scanner APK
      uses: actions/download-artifact@v4
      with:
        name: scanner-apk
        path: scanner-apk
    - name: Download night_vision APK
      uses: actions/download-artifact@v4
      with:
        name: night_vision-apk
        path: night_vision-apk
    - name: Find APK files
      id: find_apks
      run: |
        echo "Finding APK files..."
        find scanner-apk -name "*.apk" -type f
        find night_vision-apk -name "*.apk" -type f
    - name: Rename APKs
      run: |
        mkdir -p release-files
        cp scanner-apk/release/app-release.apk release-files/scanner-release.apk || \
        cp scanner-apk/**/release/app-release.apk release-files/scanner-release.apk || \
        find scanner-apk -name "*-release.apk" -type f -exec cp {} release-files/scanner-release.apk \;
        cp night_vision-apk/release/app-release.apk release-files/night_vision-release.apk || \
        cp night_vision-apk/**/release/app-release.apk release-files/night_vision-release.apk || \
        find night_vision-apk -name "*-release.apk" -type f -exec cp {} release-files/night_vision-release.apk \;
        ls -la release-files/
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-files/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
